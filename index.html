<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
                <div>
                    <h3>TEAM 1</h3>
                    <h1 id="home-score">0</h1>
                    <div class="home-button">
                        <button id="home-add-one" onclick="addOneHome()">+1</button>
                        <button id="home-add-two" onclick="addTwoHome()">+2</button>
                        <button id="home-add-three" onclick="addThreeHome()">+3</button>
                    </div>
                </div>
                <div>
                    <h3>TEAM 2</h3>
                    <h1 id="away-score">0</h1>
                    <div class="away-button">
                        <button id="away-add-one" onclick="addOneAway()">+1</button>
                        <button id="away-add-two" onclick="addTwoAway()">+2</button>
                        <button id="away-add-three" onclick="addThreeAway()">+3</button>
                    </div>
                </div>
            </div>
        </div>
        <button id="reset-button" onclick="reset()">RESET</button>
        <script src="index.js"></script>
    </body>
</html>
